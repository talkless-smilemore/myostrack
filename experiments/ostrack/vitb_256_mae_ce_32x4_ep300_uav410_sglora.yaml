# SGLoRA: Spectral-Gated Low-Rank Adaptation
# Deeply fused PEFT that replaces the OPLoRA + NeuroAda stack with a
# single unified formulation:
#
#   ΔW = (alpha/r) · diag(g) · P_L · B · A · P_R
#   where P_R = I - V_k V_k^T,  P_L = I - U_k U_k^T
#
# Key innovations vs. NS-OPLoRA:
#   1. KEPT:   P_R + P_L (full OPLoRA orthogonal skeleton)
#   2. NEW:    g = sigmoid(s) replaces static binary mask M (NeuroAda)
#   3. NEW:    gate initialised from SVD spectrum, not weight magnitude
#   4. NEW:    dynamic entropy schedule — learn first, sparsify later
#   5. NEW:    group-lasso on B rows for neuron-level sparsity
#
# Layer selection — evidence-based (OSTrack_Layer_Analysis.md perturbation experiments).
# See LAYER_CONFIGS section below for per-layer justification.
#
# Entropy schedule (λ_e):
#   epoch 0 ~ 20   → λ = 0           (free learning)
#   epoch 20 ~ 40  → λ = 0 → 1e-4   (gradual sparsification)
#   epoch 40+      → λ = 1e-4        (hard binary gates, compression-ready)

DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128

  TRAIN:
    DATASETS_NAME:
    - ANTI_UAV_TRAIN
    - ANTI_UAV410_TRAIN
    - ANTI_UAV600_TRAIN
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 30000
  VAL:
    DATASETS_NAME:
    - ANTI_UAV_VAL
    - ANTI_UAV410_VAL
    - ANTI_UAV600_VAL
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 5000

MODEL:
  PRETRAIN_FILE: "E:/code/UAV/OSTrack-main/weights/OSTrack_vitb256_ep300/OSTrack_ep0300.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: 'CTR_POINT'
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  CENTER_PRIOR:
    ENABLE: false
    NUM_BINS: 16

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 16

  # Old methods — disabled for SGLoRA
  OPLORA:
    ENABLE: false
  NEURO_OPLORA:
    ENABLE: false

  # SGLoRA: the deeply fused approach
  SGLORA:
    ENABLE: true
    # ── 层选择总览（基于 OSTrack_Layer_Analysis.md 扰动实验）─────────────
    # 综合敏感性 = PatchShuffle + GaussBlur + PhaseScramble
    #
    #   B0: 0.729  ❄冻结   patch embedding，纯投影无学习能力
    #   B1: 1.224  🟢rank8  纹理点火（B0→B1 的 PatchShuffle 从 0.149 暴增到 0.691，+4.6×）
    #   B2: 1.061  🟣rank4  跨 fragment 构建全局空间布局，新视角/新尺度适配
    #   B3: 1.170  🟡rank8  CE-1 空间筛选入口，结构敏感性主导，CE 起点 ★
    #   B4: 1.089  ❄冻结   过渡精炼层，gap 仅 +0.096，优先级 ⭐
    #   B5: 1.380  🟣rank4  CE 后在稀疏 token 上重建局部关联，双指标双高
    #   B6: 1.559  🟡rank8  CE-2 综合决策 #1，全模型唯一三指标均衡点，GaussBlur 峰值 0.538 ★
    #   B7: 1.491  🟢rank8  信息融合枢纽 #2，纹理+结构双轨融合，PatchShuffle+PhaseScramble 双高
    #   B8: 0.843  🟠rank2  最纯局部纹理层，PhaseScramble=0.202 全模型最低，遮挡场景必需
    #   B9: 1.479  🟡rank8  CE-3 纹理筛选 #3，PatchShuffle 峰值 0.713，外观迁移核心 ★
    #   B10:1.246  ❄冻结   细化微调层，综合敏感度尚可但优先级 ⭐
    #   B11:1.025  ❄冻结   稳定输出层，扰动不敏感，特征已成形
    #
    # 注入 8 层 / 冻结 4 层
    # ────────────────────────────────────────────────────────────────────────
    LAYER_CONFIGS:
      # Group A: core adaptation — rank=8, all Linear targets
      - blocks: [7, 1]           # B7 fusion hub + B1 texture ignition
        rank: 8
        top_k: 16
        alpha: 8.0
        targets: ["attn.qkv", "attn.proj", "mlp.fc1", "mlp.fc2"]
      # Group B: CE decision — rank=8, attention only
      - blocks: [6, 9, 3]        # B6 comprehensive (#1) + B9 texture (#3) + B3 spatial
        rank: 8
        top_k: 16
        alpha: 8.0
        targets: ["attn.qkv", "attn.proj"]
      # Group C: structural support — rank=4, MLP only
      - blocks: [5, 2]           # B5 post-CE reconstruction + B2 global spatial
        rank: 4
        top_k: 16
        alpha: 8.0
        targets: ["mlp.fc1", "mlp.fc2"]
      # Group D: occlusion edge-case — rank=2, attention only
      - blocks: [8]              # B8 pure local texture, critical for occlusion
        rank: 2
        top_k: 16
        alpha: 8.0
        targets: ["attn.qkv", "attn.proj"]
      # FROZEN: B0, B4, B10, B11
    # Entropy schedule: λ_max ramps from 0→max over [warmup, warmup+anneal]
    ENTROPY_LAM_MAX: 5e-5    # lower peak: gentler sparsification
    WARMUP_RATIO: 0.5        # epoch  0~20: λ=0
    ANNEAL_RATIO: 0.25       # epoch 20~30: λ ramps
                              # epoch 30~40: λ=5e-5 max
    GROUP_LASSO_LAM_MAX: 1e-5

  EPOCH: 40
  SAVE_EPOCHS: [20]            # extra checkpoint at epoch 20 (besides last 5 epochs)
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0004
  LR_DROP_EPOCH: 32
  NUM_WORKER: 2
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 10
  WEIGHT_DECAY: 0.0001
  AMP: False

TEST:
  EPOCH: 40
  SEARCH_FACTOR: 3.6
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.2
  TEMPLATE_SIZE: 128
  KALMAN_FILTER:
    ENABLE: false
    DT: 1.0
    BASE_PROCESS_NOISE: 0.01
    VELOCITY_NOISE_SCALE: 10.0
    SIZE_NOISE_SCALE: 2.0
    BASE_OBS_NOISE: 5.0
    ADAPT_THRESHOLD: 5.0
    ADAPT_GAIN: 2.0
    DECAY_RATE: 0.95
    MAX_Q_SCALE: 10.0
    CONF_THRESHOLD: 0.3
    MIN_SEARCH_FACTOR: 2.5
    MAX_SEARCH_FACTOR: 5.0
    SAFETY_MARGIN: 1.5
    MAX_LOW_CONF_FRAMES: 5
