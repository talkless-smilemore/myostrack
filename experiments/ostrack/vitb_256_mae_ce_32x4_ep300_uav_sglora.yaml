# UAV-WSP (Weighted Spectral Projection): anti-UAV small-target adapter
# Core innovation: P = I - UDUᵀ replaces P = I - UUᵀ (hard cut → graduated protection)
#   d_i = (σ_i / σ₁)^β  preserves a gradient of adaptation capacity across the spectrum
# Anti-UAV advantages:
#   - Mid-ranked σ directions carry fine target details — no longer discarded
#   - Gate initialisation biased by per-channel detail saliency
#   - Focus regularisation (Gini↑) pushes sparse target-saliency concentration

DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128

  TRAIN:
    DATASETS_NAME:
    - ANTI_UAV_TRAIN
    - ANTI_UAV410_TRAIN
    - ANTI_UAV600_TRAIN
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 30000
  VAL:
    DATASETS_NAME:
    - ANTI_UAV_VAL
    - ANTI_UAV410_VAL
    - ANTI_UAV600_VAL
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 5000

MODEL:
  PRETRAIN_FILE: "E:/code/UAV/OSTrack-main/weights/OSTrack_vitb256_ep300/OSTrack_ep0300.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: 'CTR_POINT'
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  CENTER_PRIOR:
    ENABLE: false
    NUM_BINS: 16

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 16

  # UAV-WSP (Weighted Spectral Projection): anti-UAV small-target adapter
  # ── 核心创新 ──────────────────────────────────────────────────────────
  # 1. 加权投影 P = I - UDUᵀ, d_i = (σ_i/σ₁)^β
  #    硬切断 → 渐变保护，小目标细节从中等奇异值方向获取适应空间
  # 2. 细节显著性门控初始化
  #    与小奇异值方向耦合强的输出通道获得初始门控偏置
  # 3. 聚焦正则化 (Gini 系数最大化)
  #    推动门控集中在少数通道 → 模拟小目标的空间稀疏性
  # ──────────────────────────────────────────────────────────────────────
  UAV_WSP:
    ENABLE: true
    # ── 层选择（基于 OSTrack_Layer_Analysis.md 扰动实验）────────────────
    LAYER_CONFIGS:
      # Group A: core adaptation — rank=8, all targets, β=1.0
      - blocks: [7, 1]
        rank: 8
        top_k: 16
        alpha: 8.0
        spectral_beta: 1.0
        targets: ["attn.qkv", "attn.proj", "mlp.fc1", "mlp.fc2"]
      # Group B: CE decision layers — rank=8, attention only, β=1.0
      - blocks: [6, 9, 3]
        rank: 8
        top_k: 16
        alpha: 8.0
        spectral_beta: 1.0
        targets: ["attn.qkv", "attn.proj"]
      # Group C: structural support — rank=4, MLP only, β=1.0
      - blocks: [5, 2]
        rank: 4
        top_k: 16
        alpha: 8.0
        spectral_beta: 1.0
        targets: ["mlp.fc1", "mlp.fc2"]
      # Group D: occlusion edge-case — rank=2, β=0.6 (more adaptation freedom)
      # β=0.6 给小奇异值方向更多适应空间 → 遮挡细节保留
      - blocks: [8]
        rank: 2
        top_k: 16
        alpha: 8.0
        spectral_beta: 0.6
        targets: ["attn.qkv", "attn.proj"]
    # Regularisation schedule
    ENTROPY_LAM_MAX: 5e-5
    WARMUP_RATIO: 0.5
    ANNEAL_RATIO: 0.25
    GROUP_LASSO_LAM_MAX: 1e-5
    FOCUS_LAM_MAX: 1e-5       # 聚焦正则化: 推动门控稀疏集中

  EPOCH: 40
  SAVE_EPOCHS: [20]            # extra checkpoint at epoch 20 (besides last 5 epochs)
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0004
  LR_DROP_EPOCH: 32
  NUM_WORKER: 2
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 10
  WEIGHT_DECAY: 0.0001
  AMP: False

TEST:
  EPOCH: 40
  SEARCH_FACTOR: 3.6
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.2
  TEMPLATE_SIZE: 128
  KALMAN_FILTER:
    ENABLE: false
    DT: 1.0
    BASE_PROCESS_NOISE: 0.01
    VELOCITY_NOISE_SCALE: 10.0
    SIZE_NOISE_SCALE: 2.0
    BASE_OBS_NOISE: 5.0
    ADAPT_THRESHOLD: 5.0
    ADAPT_GAIN: 2.0
    DECAY_RATE: 0.95
    MAX_Q_SCALE: 10.0
    CONF_THRESHOLD: 0.3
    MIN_SEARCH_FACTOR: 2.5
    MAX_SEARCH_FACTOR: 5.0
    SAFETY_MARGIN: 1.5
    MAX_LOW_CONF_FRAMES: 5
