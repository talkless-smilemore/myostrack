# SGLoRA: Spectral-Gated Low-Rank Adaptation
# Deeply fused PEFT that replaces the OPLoRA + NeuroAda stack with a
# single unified formulation:
#
#   ΔW = (alpha/r) · diag(sigmoid(s)) · B · A · (I - V_k V_k^T)
#
# Key innovations vs. NS-OPLoRA:
#   1. KEPT:   P_R (input projection) — protects pre-trained principal components
#   2. REMOVED: P_L (output projection) — replaced by learnable spectral gate
#   3. NEW:     learnable soft gate g = sigmoid(s), initialised from SVD spectrum
#   4. NEW:     dynamic entropy schedule — learn first, sparsify later
#   5. NEW:     group-lasso on B rows for neuron-level sparsity
#
# Layer selection — evidence-based (OSTrack_Layer_Analysis.md perturbation experiments):
#   Comprehensive sensitivity = PatchShuffle + GaussBlur + PhaseScramble
#
#   B6: 1.559 (highest) — CE comprehensive decision, GaussBlur peak
#   B7: 1.491           — fusion hub, texture+structure dual-track
#   B9: 1.479           — CE texture screening, PatchShuffle peak
#   B5: 1.380           — post-CE reconstruction
#   B1: 1.224           — texture ignition (4.6× jump from B0: 0.149→0.691)
#   B3: 1.170           — CE spatial screening
#   B2: 1.061           — global spatial construction
#
#   ★ B0, B4, B8, B10, B11 are FROZEN (low sensitivity / no learning capacity)
#   ★ B7 was wrongly frozen in NS-OPLoRA — actually 2nd most important layer
#
# Injected: 7 layers (B1,B2,B3,B5,B6,B7,B9)  |  Frozen: 5 layers (B0,B4,B8,B10,B11)
#
# Entropy schedule (λ_e):
#   epoch 0 ~ 20   → λ = 0           (free learning)
#   epoch 20 ~ 40  → λ = 0 → 1e-4   (gradual sparsification)
#   epoch 40+      → λ = 1e-4        (hard binary gates, compression-ready)

DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128

  TRAIN:
    DATASETS_NAME:
    - ANTI_UAV_TRAIN
    - ANTI_UAV410_TRAIN
    - ANTI_UAV600_TRAIN
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 30000
  VAL:
    DATASETS_NAME:
    - ANTI_UAV_VAL
    - ANTI_UAV410_VAL
    - ANTI_UAV600_VAL
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 5000

MODEL:
  PRETRAIN_FILE: "E:/code/UAV/OSTrack-main/weights/OSTrack_vitb256_ep300/OSTrack_ep0300.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: 'CTR_POINT'
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  CENTER_PRIOR:
    ENABLE: false
    NUM_BINS: 16

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 16

  # Old methods — disabled for SGLoRA
  OPLORA:
    ENABLE: false
  NEURO_OPLORA:
    ENABLE: false

  # SGLoRA: the deeply fused approach
  SGLORA:
    ENABLE: true
    # LAYER_CONFIGS: null -> uses SGLORA_DEFAULT_LAYER_CONFIG
    LAYER_CONFIGS: null
    # Entropy schedule: λ_max ramps from 0→max over [warmup, warmup+anneal]
    ENTROPY_LAM_MAX: 1e-4
    WARMUP_RATIO: 0.33       # epoch  0~20: λ=0
    ANNEAL_RATIO: 0.33       # epoch 20~40: λ ramps
                              # epoch 40~60: λ=1e-4 max
    GROUP_LASSO_LAM_MAX: 1e-5

  EPOCH: 60
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0004
  LR_DROP_EPOCH: 48
  NUM_WORKER: 2
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 10
  WEIGHT_DECAY: 0.0001
  AMP: False

TEST:
  EPOCH: 60
  SEARCH_FACTOR: 3.6
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.2
  TEMPLATE_SIZE: 128
  KALMAN_FILTER:
    ENABLE: false
    DT: 1.0
    BASE_PROCESS_NOISE: 0.01
    VELOCITY_NOISE_SCALE: 10.0
    SIZE_NOISE_SCALE: 2.0
    BASE_OBS_NOISE: 5.0
    ADAPT_THRESHOLD: 5.0
    ADAPT_GAIN: 2.0
    DECAY_RATE: 0.95
    MAX_Q_SCALE: 10.0
    CONF_THRESHOLD: 0.3
    MIN_SEARCH_FACTOR: 2.5
    MAX_SEARCH_FACTOR: 5.0
    SAFETY_MARGIN: 1.5
    MAX_LOW_CONF_FRAMES: 5
