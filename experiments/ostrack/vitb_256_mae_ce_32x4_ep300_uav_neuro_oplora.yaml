# NS-OPLoRA: Neuron-Selective Orthogonal Projection LoRA
# Anti-UAV fine-tuning with layer-wise differentiated PEFT.
#
# Key design:
#   - Shallow blocks 0-2  : strong adapt (p=0.8, rank=8, all Linear targets)
#   - CE blocks 3, 6, 9   : attn-focused (p=0.6, rank=4, qkv+proj only)
#   - Mid blocks 4, 5      : MLP-only light adapt (p=0.5, rank=4, fc1+fc2 only)
#   - Deep blocks 7,8,10,11: FROZEN (no PEFT)
#
# This targets anti-UAV scenarios: small targets -> shallow detail layers matter most;
# fast motion -> CE pruning quality matters most.

DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128

  TRAIN:
    DATASETS_NAME:
    - ANTI_UAV_TRAIN
    - ANTI_UAV410_TRAIN
    - ANTI_UAV600_TRAIN
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 30000
  VAL:
    DATASETS_NAME:
    - ANTI_UAV_VAL
    - ANTI_UAV410_VAL
    - ANTI_UAV600_VAL
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 5000

MODEL:
  PRETRAIN_FILE: "E:/code/UAV/OSTrack-main/weights/OSTrack_vitb256_ep300/OSTrack_ep0300.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: 'CTR_POINT'
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  # Euclidean distance centre prior (Fan et al. 2026) — static spatial prior
  CENTER_PRIOR:
    ENABLE: false
    NUM_BINS: 16

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 16

  # Plain OPLoRA disabled in favour of NS-OPLoRA
  OPLORA:
    ENABLE: false
    RANK: 8
    TOP_K: 16
    ALPHA: 8.0
    TARGETS: ["qkv", "proj", "fc1", "fc2"]

  # NS-OPLoRA: layer-selective neuron-selective OPLoRA
  NEURO_OPLORA:
    ENABLE: true
    # LAYER_CONFIGS: null  -> uses ANTI_UAV_DEFAULT_LAYER_CONFIG
    #   blocks 0-2  : rank=8, neuron_p=0.8, targets=[attn.qkv, attn.proj, mlp.fc1, mlp.fc2]
    #   blocks 3,6,9: rank=4, neuron_p=0.6, targets=[attn.qkv, attn.proj]
    #   blocks 4,5  : rank=4, neuron_p=0.5, targets=[mlp.fc1, mlp.fc2]
    #   blocks 7,8,10,11: frozen (no injection)
    LAYER_CONFIGS: null

  EPOCH: 40
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0004
  LR_DROP_EPOCH: 32
  NUM_WORKER: 2
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 10
  WEIGHT_DECAY: 0.0001
  AMP: False

TEST:
  EPOCH: 40
  SEARCH_FACTOR: 3.6
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.2
  TEMPLATE_SIZE: 128
  # Adaptive Kalman filter + adaptive search factor (inference only) — dynamic temporal prior
  KALMAN_FILTER:
    ENABLE: false
    DT: 1.0
    BASE_PROCESS_NOISE: 0.01
    VELOCITY_NOISE_SCALE: 10.0
    SIZE_NOISE_SCALE: 2.0
    BASE_OBS_NOISE: 5.0
    ADAPT_THRESHOLD: 5.0
    ADAPT_GAIN: 2.0
    DECAY_RATE: 0.95
    MAX_Q_SCALE: 10.0
    CONF_THRESHOLD: 0.3
    MIN_SEARCH_FACTOR: 2.5
    MAX_SEARCH_FACTOR: 5.0
    SAFETY_MARGIN: 1.5
    MAX_LOW_CONF_FRAMES: 5
