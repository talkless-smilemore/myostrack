# A4 384 UAV-WSP config.
# Use true 384/192 crops and keep only middle blocks B4-B7 with uniform
# rank=8, all targets, beta=0.5. Put a 384 OSTrack checkpoint at the
# PRETRAIN_FILE path below, or edit that single line to your actual path.

DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 4.5
    FACTOR: 5.0
    SCALE_JITTER: 0.5
    SIZE: 384
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 192

  TRAIN:
    DATASETS_NAME:
    - ANTI_UAV_TRAIN
    - ANTI_UAV410_TRAIN
    - ANTI_UAV600_TRAIN
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 30000
  VAL:
    DATASETS_NAME:
    - ANTI_UAV_VAL
    - ANTI_UAV410_VAL
    - ANTI_UAV600_VAL
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 5000

MODEL:
  PRETRAIN_FILE: "E:/code/UAV/OSTrack-main/weights/OSTrack_vitb384_ep300/OSTrack_ep0300.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: 'CTR_POINT'
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  CENTER_PRIOR:
    ENABLE: false
    NUM_BINS: 16

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 8

  UAV_WSP:
    ENABLE: true
    LAYER_CONFIGS:
      # A4: only B4-B7 use WSP; B0-B3 and B8-B11 are frozen.
      - blocks: [4, 5, 6, 7]
        rank: 8
        top_k: 16
        alpha: 8.0
        spectral_beta: 0.5
        targets: ["attn.qkv", "attn.proj", "mlp.fc1", "mlp.fc2"]

    ENTROPY_LAM_MAX: 1e-5
    WARMUP_RATIO: 0.5
    ANNEAL_RATIO: 0.25
    GROUP_LASSO_LAM_MAX: 5e-6
    FOCUS_LAM_MAX: 0.0

  TEMPORAL_SMOOTHNESS:
    ENABLE: true
    LOSS_WEIGHT: 0.05

  EPOCH: 40
  SAVE_EPOCHS: [20]
  SAVE_BEST: true
  SAVE_BEST_METRIC: "Loss/total"
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0004
  LR_DROP_EPOCH: 32
  NUM_WORKER: 0
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 10
  WEIGHT_DECAY: 0.0001
  AMP: True

TEST:
  EPOCH: 40
  CHECKPOINT: "E:/code/UAV/OSTrack-main/output/checkpoints/train/ostrack/vitb_384_mae_ce_32x4_ep300_uav_wsp_best384/OSTrack_best.pth.tar"
  SEARCH_FACTOR: 5.0
  SEARCH_SIZE: 384
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 192
  KALMAN_FILTER:
    ENABLE: false
    DT: 1.0
    BASE_PROCESS_NOISE: 0.01
    VELOCITY_NOISE_SCALE: 10.0
    SIZE_NOISE_SCALE: 2.0
    BASE_OBS_NOISE: 5.0
    ADAPT_THRESHOLD: 5.0
    ADAPT_GAIN: 2.0
    DECAY_RATE: 0.95
    MAX_Q_SCALE: 10.0
    CONF_THRESHOLD: 0.3
    MIN_SEARCH_FACTOR: 2.5
    MAX_SEARCH_FACTOR: 5.0
    SAFETY_MARGIN: 1.5
    MAX_LOW_CONF_FRAMES: 5
